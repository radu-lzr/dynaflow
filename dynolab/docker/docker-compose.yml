version: '3.8'

services:
  # ============ DATABASES ============

  pg-auth:
    image: postgres:16-alpine
    container_name: dynolab-pg-auth
    environment:
      POSTGRES_DB: ${PG_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_AUTH_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pg-access:
    image: postgres:16-alpine
    container_name: dynolab-pg-access
    environment:
      POSTGRES_DB: ${PG_ACCESS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - pg_access_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_ACCESS_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pg-site:
    image: postgres:16-alpine
    container_name: dynolab-pg-site
    environment:
      POSTGRES_DB: ${PG_SITE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5434:5432'
    volumes:
      - pg_site_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_SITE_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pg-client-vehicle:
    image: postgres:16-alpine
    container_name: dynolab-pg-client-vehicle
    environment:
      POSTGRES_DB: ${PG_CLIENT_VEHICLE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5435:5432'
    volumes:
      - pg_client_vehicle_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_CLIENT_VEHICLE_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pg-map:
    image: postgres:16-alpine
    container_name: dynolab-pg-map
    environment:
      POSTGRES_DB: ${PG_MAP_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5436:5432'
    volumes:
      - pg_map_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_MAP_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pg-workshop:
    image: postgres:16-alpine
    container_name: dynolab-pg-workshop
    environment:
      POSTGRES_DB: ${PG_WORKSHOP_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5437:5432'
    volumes:
      - pg_workshop_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${PG_WORKSHOP_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dynolab-timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5438:5432'
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${TIMESCALE_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry:
    build:
      context: ..
      dockerfile: services/telemetry/Dockerfile
    container_name: dynolab-telemetry
    environment:
      PORT: ${TELEMETRY_PORT}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${TIMESCALE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${TELEMETRY_PORT}:${TELEMETRY_PORT}'
    depends_on:
      timescaledb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: dynolab-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'')" --quiet']
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ SERVICES ============

  auth:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: dynolab-auth
    environment:
      PORT: ${AUTH_PORT}
      POSTGRES_HOST: pg-auth
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS}
      LOCK_DURATION_MINUTES: ${LOCK_DURATION_MINUTES}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
    depends_on:
      pg-auth:
        condition: service_healthy
      redis:
        condition: service_started

  access:
    build:
      context: ..
      dockerfile: services/access/Dockerfile
    container_name: dynolab-access
    environment:
      PORT: ${ACCESS_PORT}
      POSTGRES_HOST: pg-access
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_ACCESS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${ACCESS_PORT}:${ACCESS_PORT}'
    depends_on:
      pg-access:
        condition: service_healthy

  site:
    build:
      context: ..
      dockerfile: services/site/Dockerfile
    container_name: dynolab-site
    environment:
      PORT: ${SITE_PORT}
      POSTGRES_HOST: pg-site
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_SITE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${SITE_PORT}:${SITE_PORT}'
    depends_on:
      pg-site:
        condition: service_healthy

  vehicle:
    build:
      context: ..
      dockerfile: services/vehicle/Dockerfile
    container_name: dynolab-vehicle
    environment:
      PORT: ${VEHICLE_PORT}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${VEHICLE_PORT}:${VEHICLE_PORT}'
    depends_on:
      mongodb:
        condition: service_healthy

  client-vehicle:
    build:
      context: ..
      dockerfile: services/client-vehicle/Dockerfile
    container_name: dynolab-client-vehicle
    environment:
      PORT: ${CLIENT_VEHICLE_PORT}
      POSTGRES_HOST: pg-client-vehicle
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_CLIENT_VEHICLE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${CLIENT_VEHICLE_PORT}:${CLIENT_VEHICLE_PORT}'
    depends_on:
      pg-client-vehicle:
        condition: service_healthy

  # ============ INFRASTRUCTURE ============

  redis:
    image: redis:7-alpine
    container_name: dynolab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dynolab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dynolab-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  map:
    build:
      context: ..
      dockerfile: services/map/Dockerfile
    container_name: dynolab-map
    environment:
      PORT: ${MAP_PORT}
      POSTGRES_HOST: pg-map
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_MAP_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: dynolab-maps
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${MAP_PORT}:${MAP_PORT}'
    depends_on:
      pg-map:
        condition: service_healthy
      minio:
        condition: service_healthy

  workshop:
    build:
      context: ..
      dockerfile: services/workshop/Dockerfile
    container_name: dynolab-workshop
    environment:
      PORT: ${WORKSHOP_PORT}
      POSTGRES_HOST: pg-workshop
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PG_WORKSHOP_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      ACCESS_SERVICE_URL: http://access:${ACCESS_PORT}
      TELEMETRY_SERVICE_URL: http://telemetry:${TELEMETRY_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${WORKSHOP_PORT}:${WORKSHOP_PORT}'
    depends_on:
      pg-workshop:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pg_auth_data:
  pg_access_data:
  pg_site_data:
  pg_client_vehicle_data:
  pg_map_data:
  pg_workshop_data:
  timescale_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
