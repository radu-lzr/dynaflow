name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  bruno-tests:
    name: Auth, Access, Site, Vehicle, and Client Vehicle Bruno tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Start databases and Redis
        run: docker compose -f docker/docker-compose.yml up -d pg-auth pg-access pg-site pg-client-vehicle timescaledb mongodb redis

      - name: Wait for PostgreSQL
        run: |
          until docker compose -f docker/docker-compose.yml exec -T pg-auth pg_isready -U dynolab -d dynolab_auth >/dev/null 2>&1; do
            sleep 2
          done
          until docker compose -f docker/docker-compose.yml exec -T pg-access pg_isready -U dynolab -d dynolab_access >/dev/null 2>&1; do
            sleep 2
          done
          until docker compose -f docker/docker-compose.yml exec -T pg-site pg_isready -U dynolab -d dynolab_site >/dev/null 2>&1; do
            sleep 2
          done
          until docker compose -f docker/docker-compose.yml exec -T pg-client-vehicle pg_isready -U dynolab -d dynolab_client_vehicle >/dev/null 2>&1; do
            sleep 2
          done
          until docker compose -f docker/docker-compose.yml exec -T timescaledb pg_isready -U dynolab -d dynolab_telemetry >/dev/null 2>&1; do
            sleep 2
          done

      - name: Start auth, access, site, vehicle, client-vehicle, and telemetry services
        run: docker compose -f docker/docker-compose.yml up -d auth access site vehicle client-vehicle telemetry

      - name: Wait for service health checks
        run: |
          until curl -fsS http://localhost:4001/health >/dev/null; do
            sleep 2
          done
          until curl -fsS http://localhost:4002/health >/dev/null; do
            sleep 2
          done
          until curl -fsS http://localhost:4003/health >/dev/null; do
            sleep 2
          done
          until curl -fsS http://localhost:4004/health >/dev/null; do
            sleep 2
          done
          until curl -fsS http://localhost:4005/health >/dev/null; do
            sleep 2
          done
          until curl -fsS http://localhost:4008/health >/dev/null; do
            sleep 2
          done

      - name: Run auth Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run auth --env local -r --output results_auth_ci.json

      - name: Run access Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run access --env local -r --output results_access_ci.json

      - name: Run site Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run site --env local -r --output results_site_ci.json

      - name: Run vehicle Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run vehicle --env local -r --output results_vehicle_ci.json

      - name: Run client-vehicle Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run client-vehicle --env local -r --output results_client_vehicle_ci.json

      - name: Run telemetry Bruno collection
        working-directory: bruno
        run: pnpm dlx @usebruno/cli@latest run telemetry --env local -r --output results_telemetry_ci.json

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color auth access site vehicle client-vehicle telemetry pg-auth pg-access pg-site pg-client-vehicle timescaledb mongodb redis

      - name: Tear down containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
