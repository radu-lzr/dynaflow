apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: dynaflow
  source:
    repoURL: ghcr.io/nginx/charts
    chart: nginx-gateway-fabric
    targetRevision: 2.5.0
    helm:
      valuesObject:
        service:
          type: LoadBalancer
        nginxGateway:
          snippets:
            enable: true
          config:
            logging:
              level: info
        nginx:
          extraVolumes:
          - name: ngf-map-client-cert
            secret:
              secretName: ngf-map-client-cert
          extraVolumeMounts:
          - name: ngf-map-client-cert
            mountPath: /etc/nginx/client-certs/map
            readOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dynaflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
