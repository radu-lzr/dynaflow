apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: dynaflow
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Dynaflow",
          "Group": "Servers",
          "Host": "postgres.dynaflow.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "dynaflow",
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: dynaflow
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: admin@dynolab.be
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgadmin-credentials
              key: password
        - name: SCRIPT_NAME
          value: /pgadmin
        - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
          value: "False"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /pgadmin/misc/ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /pgadmin/misc/ping
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: servers
          mountPath: /pgadmin4/servers.json
          subPath: servers.json
          readOnly: true
      volumes:
      - name: servers
        configMap:
          name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: dynaflow
spec:
  selector:
    app: pgadmin
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin-route
  namespace: dynaflow
spec:
  parentRefs:
  - name: dynaflow-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /pgadmin
    backendRefs:
    - name: pgadmin
      port: 80
