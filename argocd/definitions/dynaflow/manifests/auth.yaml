apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dynaflow
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ghcr.io/radu-lzr/dynaflow/auth:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: postgres.dynaflow.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: dynaflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: auth
        - name: REDIS_HOST
          value: redis.dynaflow.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dynaflow-secrets
              key: jwt-secret
        - name: JWT_ACCESS_TTL
          value: "900"
        - name: REFRESH_TOKEN_TTL_DAYS
          value: "7"
        - name: MAX_LOGIN_ATTEMPTS
          value: "5"
        - name: LOCK_DURATION_MINUTES
          value: "15"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dynaflow
spec:
  selector:
    app: auth
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
  namespace: dynaflow
spec:
  parentRefs:
  - name: dynaflow-gateway
    sectionName: https
  rules:
  # Public — no auth required
  - matches:
    - path:
        type: Exact
        value: /api/auth/login
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /auth/login
    backendRefs:
    - name: auth-service
      port: 80
  - matches:
    - path:
        type: Exact
        value: /api/auth/register
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /auth/register
    backendRefs:
    - name: auth-service
      port: 80
  # All other auth endpoints require full auth + permissions check
  - matches:
    - path:
        type: PathPrefix
        value: /api/auth
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /auth
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: access-required
    backendRefs:
    - name: auth-service
      port: 80
