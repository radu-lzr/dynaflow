apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dynaflow
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ghcr.io/radu-lzr/dynaflow/auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: postgres-db-postgresql.dynaflow.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: dynaflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: auth
        - name: REDIS_HOST
          value: redis-master.dynaflow.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dynaflow-secrets
              key: jwt-secret
        - name: JWT_ACCESS_TTL
          value: "900"
        - name: REFRESH_TOKEN_TTL_DAYS
          value: "7"
        - name: MAX_LOGIN_ATTEMPTS
          value: "5"
        - name: LOCK_DURATION_MINUTES
          value: "15"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dynaflow
spec:
  selector:
    app: auth
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-route
  namespace: dynaflow
spec:
  parentRefs:
  - name: dynaflow-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/auth
    backendRefs:
    - name: auth-service
      port: 80
