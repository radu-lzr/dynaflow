apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: auth-required
  namespace: dynaflow
spec:
  snippets:
    - context: http.server.location
      value: |
        auth_request /internal/auth-verify;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_account_type $upstream_http_x_account_type;
        auth_request_set $auth_status $upstream_status;
        if ($auth_status = 400) {
          return 400;
        }
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Account-Type $user_account_type;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: access-required
  namespace: dynaflow
spec:
  snippets:
    - context: http.server.location
      value: |
        auth_request /internal/access-check;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_account_type $upstream_http_x_account_type;
        auth_request_set $auth_status $upstream_status;
        if ($auth_status = 400) {
          return 400;
        }
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Account-Type $user_account_type;
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
---
# Applied to the map HTTPRoute: configures NGF to present its client cert when proxying to map-service mTLS sidecar
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: map-mtls-backend
  namespace: dynaflow
spec:
  snippets:
  - context: http.server.location
    value: |
      proxy_ssl                     on;
      proxy_ssl_certificate         /etc/nginx/client-certs/map/tls.crt;
      proxy_ssl_certificate_key     /etc/nginx/client-certs/map/tls.key;
      proxy_ssl_verify              on;
      proxy_ssl_trusted_certificate /etc/nginx/client-certs/map/ca.crt;
      proxy_ssl_server_name         on;
      proxy_ssl_name                map-service.dynaflow.svc.cluster.local;
