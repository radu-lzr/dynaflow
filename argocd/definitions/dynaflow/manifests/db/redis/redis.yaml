apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dynaflow
spec:
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config-template
  namespace: dynaflow
data:
  redis.conf.template: |
    # Redis configuration
    port 6379
    loglevel notice
    databases 16
    dir /data
    requirepass REDIS_PASSWORD_PLACEHOLDER

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: dynaflow
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      initContainers:
        - name: init-config
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              PASSWORD=$(cat /run/credentials/redis-password)
              sed "s|REDIS_PASSWORD_PLACEHOLDER|$PASSWORD|" /etc/redis-template/redis.conf.template > /etc/redis/redis.conf
              chmod 644 /etc/redis/redis.conf
          volumeMounts:
            - name: config-template
              mountPath: /etc/redis-template
              readOnly: true
            - name: config
              mountPath: /etc/redis
            - name: redis-password
              mountPath: /run/credentials
              readOnly: true
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args:
            - /etc/redis/redis.conf
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: redis-password
              mountPath: /run/credentials
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - redis-cli -a "$(cat /run/credentials/redis-password)" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - redis-cli -a "$(cat /run/credentials/redis-password)" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: redis-config-template
        - name: config
          emptyDir: {}
        - name: redis-password
          secret:
            secretName: redis-credentials
            items:
              - key: redis-password
                path: redis-password
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 500Mi
