apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: dynaflow
data:
  init-dbs.sql: |
    CREATE DATABASE access;
    CREATE DATABASE site;
    CREATE DATABASE client_vehicle;
    CREATE DATABASE map;
    CREATE DATABASE telemetry;
    CREATE DATABASE workshop;
    GRANT ALL PRIVILEGES ON DATABASE access TO dynaflow;
    GRANT ALL PRIVILEGES ON DATABASE site TO dynaflow;
    GRANT ALL PRIVILEGES ON DATABASE client_vehicle TO dynaflow;
    GRANT ALL PRIVILEGES ON DATABASE map TO dynaflow;
    GRANT ALL PRIVILEGES ON DATABASE telemetry TO dynaflow;
    GRANT ALL PRIVILEGES ON DATABASE workshop TO dynaflow;

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dynaflow
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dynaflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dynaflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: auth
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init-dbs.sql
              subPath: init-dbs.sql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: [pg_isready, -U, dynaflow, -d, auth]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: [pg_isready, -U, dynaflow, -d, auth]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
