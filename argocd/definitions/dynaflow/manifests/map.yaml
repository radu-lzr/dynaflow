apiVersion: v1
kind: ConfigMap
metadata:
  name: map-mtls-proxy-config
  namespace: dynaflow
data:
  default.conf: |
    server {
        listen 3443 ssl;
        ssl_certificate        /etc/nginx/certs/server/tls.crt;
        ssl_certificate_key    /etc/nginx/certs/server/tls.key;
        ssl_client_certificate /etc/nginx/certs/server/ca.crt;
        ssl_verify_client      on;
        ssl_protocols          TLSv1.3;
        location / {
            proxy_pass         http://localhost:3000;
            proxy_set_header   Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-service
  namespace: dynaflow
  labels:
    app: map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map
  template:
    metadata:
      labels:
        app: map
    spec:
      containers:
      - name: map
        image: ghcr.io/radu-lzr/dynaflow/map:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: postgres.dynaflow.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: dynaflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: map
        - name: MINIO_ENDPOINT
          value: http://minio.dynaflow.svc.cluster.local:9000
        - name: MINIO_BUCKET
          value: dynolab-maps
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secret-key
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      - name: mtls-proxy
        image: nginx:alpine
        ports:
        - containerPort: 3443
        volumeMounts:
        - name: map-server-cert
          mountPath: /etc/nginx/certs/server
          readOnly: true
        - name: mtls-proxy-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: map-server-cert
        secret:
          secretName: map-server-cert
      - name: mtls-proxy-config
        configMap:
          name: map-mtls-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: map-service
  namespace: dynaflow
spec:
  selector:
    app: map
  ports:
  - name: mtls
    port: 443
    targetPort: 3443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: map-route
  namespace: dynaflow
spec:
  parentRefs:
  - name: dynaflow-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/map
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /maps
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: access-required
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: map-mtls-backend
    backendRefs:
    - name: map-service
      port: 443
