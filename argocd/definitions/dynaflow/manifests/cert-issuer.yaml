apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: radulucianlazar@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: dynaflow-gateway
            namespace: dynaflow
            kind: Gateway
            group: gateway.networking.k8s.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dynaflow-tls
  namespace: dynaflow
spec:
  secretName: dynaflow-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - dynolab.be
