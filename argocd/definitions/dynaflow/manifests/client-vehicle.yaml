apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-vehicle-service
  namespace: dynaflow
  labels:
    app: client-vehicle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-vehicle
  template:
    metadata:
      labels:
        app: client-vehicle
    spec:
      containers:
      - name: client-vehicle
        image: ghcr.io/radu-lzr/dynaflow/client-vehicle:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: POSTGRES_HOST
          value: postgres.dynaflow.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: dynaflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: POSTGRES_DB
          value: client_vehicle
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: client-vehicle-service
  namespace: dynaflow
spec:
  selector:
    app: client-vehicle
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: client-vehicle-route
  namespace: dynaflow
spec:
  parentRefs:
  - name: dynaflow-gateway
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/client-vehicle
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /client-vehicles
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: access-required
    backendRefs:
    - name: client-vehicle-service
      port: 80
