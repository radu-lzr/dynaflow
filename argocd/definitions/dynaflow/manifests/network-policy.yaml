# ============================================================
# INGRESS POLICIES
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dynaflow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# auth: reachable from NGF only
# (access-service does NOT call auth — NGF runs the auth subrequest itself before calling access)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-ingress
  namespace: dynaflow
spec:
  podSelector:
    matchLabels:
      app: auth
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-gateway
    ports:
    - port: 3000
      protocol: TCP
---
# access: reachable from NGF and workshop (temp-permissions lifecycle)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-access-ingress
  namespace: dynaflow
spec:
  podSelector:
    matchLabels:
      app: access
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-gateway
    - podSelector:
        matchLabels:
          app: workshop
    ports:
    - port: 3000
      protocol: TCP
---
