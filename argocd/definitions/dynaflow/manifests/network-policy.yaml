apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dynaflow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# NGF nginx data-plane → all application services
# Verify label with: kubectl get pods -n dynaflow -l app.kubernetes.io/name=nginx-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ngf-to-services
  namespace: dynaflow
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [auth, access, site, vehicle, client-vehicle, map, telemetry, workshop]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: nginx-gateway
    ports:
    - port: 3000
      protocol: TCP
---
# auth → PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-to-postgres
  namespace: dynaflow
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: auth
    ports:
    - port: 5432
      protocol: TCP
---
# access, site, client-vehicle, map, workshop → PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  namespace: dynaflow
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: access
    - podSelector:
        matchLabels:
          app: site
    - podSelector:
        matchLabels:
          app: client-vehicle
    - podSelector:
        matchLabels:
          app: map
    - podSelector:
        matchLabels:
          app: workshop
    ports:
    - port: 5432
      protocol: TCP
---
# telemetry → TimescaleDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
