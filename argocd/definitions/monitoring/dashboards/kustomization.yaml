apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: dynaflow-service-health
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Dynaflow"
    files:
      - dynaflow-service-health.json

  - name: dynaflow-logs
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Dynaflow"
    files:
      - dynaflow-logs.json
