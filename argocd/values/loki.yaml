loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        index:
          prefix: index_
          period: 24h

  storage:
    type: s3

minio:
  enabled: true

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard
    enableStatefulSetAutoDeletePVC: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0