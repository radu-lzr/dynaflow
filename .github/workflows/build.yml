name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'dynolab/packages/core/**'
      - 'dynolab/services/**'
      - 'dynolab/pnpm-lock.yaml'
      - 'dynolab/tsconfig.base.json'
  pull_request:
    paths:
      - 'dynolab/packages/core/**'
      - 'dynolab/services/**'
      - 'dynolab/pnpm-lock.yaml'
      - 'dynolab/tsconfig.base.json'
  workflow_dispatch:  # manual trigger always builds all

jobs:
  # ---- Detect which services changed ----
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      access: ${{ steps.filter.outputs.access }}
      site: ${{ steps.filter.outputs.site }}
      vehicle: ${{ steps.filter.outputs.vehicle }}
      client-vehicle: ${{ steps.filter.outputs.client-vehicle }}
      services: ${{ steps.build-matrix.outputs.services }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'dynolab/packages/core/**'
              - 'dynolab/pnpm-lock.yaml'
              - 'dynolab/tsconfig.base.json'
            auth:
              - 'dynolab/services/auth/**'
            access:
              - 'dynolab/services/access/**'
            site:
              - 'dynolab/services/site/**'
            vehicle:
              - 'dynolab/services/vehicle/**'
            client-vehicle:
              - 'dynolab/services/client-vehicle/**'

      - name: Build service matrix
        id: build-matrix
        run: |
          SERVICES=()
          CORE="${{ steps.filter.outputs.core }}"
          MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

          # If core changed or manual trigger → build all
          if [[ "$CORE" == "true" || "$MANUAL" == "true" ]]; then
            SERVICES=("auth" "access" "site" "vehicle" "client-vehicle")
          else
            # Only build changed services
            [[ "${{ steps.filter.outputs.auth }}" == "true" ]] && SERVICES+=("auth")
            [[ "${{ steps.filter.outputs.access }}" == "true" ]] && SERVICES+=("access")
            [[ "${{ steps.filter.outputs.site }}" == "true" ]] && SERVICES+=("site")
            [[ "${{ steps.filter.outputs.vehicle }}" == "true" ]] && SERVICES+=("vehicle")
            [[ "${{ steps.filter.outputs.client-vehicle }}" == "true" ]] && SERVICES+=("client-vehicle")
          fi

          # Output as JSON array
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi

          echo "Services to build: ${SERVICES[*]:-none}"

  # ---- Build and push ----
  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: dynolab
          file: dynolab/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}